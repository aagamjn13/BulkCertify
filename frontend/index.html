<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate certificates in bulk quickly and easily.">
    <title>BulkCertify</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>
    
    <main class="app-container">
        <header>
            <h1 class="logo">Bulk<span>Certify</span></h1>
            <p class="subtitle">Effortlessly generate certificates for your entire team.</p>
        </header>

        <section class="card input-section">
            <h2>Add Recipients</h2>
            <form id="add-recipient-form" class="form-group">
                <div class="input-wrapper">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="e.g. Jane Doe" required>
                </div>
                <div class="input-wrapper">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="e.g. jane@example.com" required>
                </div>
                <button type="submit" class="btn btn-primary" id="add-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add
                </button>
            </form>

            <div class="recipients-list-container">
                <h3><span>Recipients List (<span id="recipient-count">0</span>)</span></h3>
                <ul id="recipients-list" class="recipients-list">
                    <li class="empty-state">No recipients added yet.</li>
                </ul>
            </div>

            <button type="button" id="generate-btn" class="btn btn-accent btn-large" disabled>
                Generate Certificates
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
            </button>
        </section>

        <section id="job-status-section" class="card status-section hidden">
            <h2>Job Status</h2>
            <div class="status-indicator">
                <div id="job-spinner" class="spinner"></div>
                <p id="job-status-text">Processing...</p>
            </div>
            
            <div id="certificates-container" class="certificates-container hidden">
                <h3>Generated Certificates</h3>
                <ul id="certificates-list" class="certificates-list">
                    <!-- Certificates will be injected here -->
                </ul>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
